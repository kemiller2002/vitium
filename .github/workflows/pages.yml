name: Vitium public site
# Fail-closed Pages pipeline (VIT-NFR-003, VIT-AC-014, VIT-AC-015).
# test -> build (configure-pages + artifact) -> deploy -> verify-canonical.
# A run counts as a deploy ONLY if every job is green, including the
# read-only canonical verification against https://vitium.echelonfoundry.com/.
# Third-party actions are pinned to full commit SHAs; see docs/operations/PAGES-DNS-TLS.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Default: no token permissions. Each job requests only what it needs.
permissions: {}

concurrency:
  group: github-pages
  # Never cancel an in-flight Pages deployment midway.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify public-site, secret-scan and governance contracts
        run: npm test
      - name: Credential scan of the publishable site/ tree
        run: node scripts/secret-scan.mjs site

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Fails (and stops the pipeline) when Pages is not enabled with source
      # "GitHub Actions". No `enablement: true`: enabling Pages is an operator action.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-canonical:
    # A Pages upload is not "live": DNS, TLS, canonical and assets must be witnessed.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read-only verification of https://vitium.echelonfoundry.com/
        run: node scripts/verify-public-site.mjs
