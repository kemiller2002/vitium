name: Vitium browser and adversarial verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Adversarial contract tests (findings are TODO, not failures)
        run: npm run test:adversarial

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # cdn: the pinned Forma stylesheet is allowed (styling/contrast/motion meaningful).
        # blocked: every external request is aborted (degradation evidence).
        forma-css: [cdn, blocked]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite (320 / 375 / 1280, keyboard, axe, hostile input, intake gate)
        env:
          CI: '1'
          VITIUM_ALLOW_FORMA_CDN: ${{ matrix.forma-css == 'cdn' && '1' || '' }}
        run: npm run test:browser
      - name: Upload screenshots, axe results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitium-browser-${{ matrix.forma-css }}-${{ github.sha }}
          path: tests/browser/.output/
          retention-days: 14
          if-no-files-found: warn
