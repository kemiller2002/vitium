name: Conditor P0 installation preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conditor-install-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  install-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Conditor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/conditor-release"
          cd "$RUNNER_TEMP/conditor-release"
          gh release download v0.5.0 --repo kemiller2002/conditor \
            --pattern 'conditor-linux-x64' --pattern 'checksums.txt'
          grep -E 'conditor-linux-x64$' checksums.txt | sha256sum --check -
          gh attestation verify ./conditor-linux-x64 --repo kemiller2002/conditor
          install -m 755 ./conditor-linux-x64 "$RUNNER_TEMP/bin/conditor"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install verified Praxis and Ordo native dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in 'praxis v3.7.2 praxis-linux-x64.tar.gz' 'ordo v1.5.0 ordo-linux-x64.tar.gz'; do
            read -r repo version asset <<< "$spec"
            mkdir -p "$RUNNER_TEMP/$repo"
            cd "$RUNNER_TEMP/$repo"
            gh release download "$version" --repo "kemiller2002/$repo" \
              --pattern "$asset" --pattern 'native-checksums.txt'
            grep -F "$asset" native-checksums.txt | sha256sum --check -
            tar -xzf "$asset"
            executable=$(find . -type f -name "$repo" | head -n 1)
            if [ -z "$executable" ]; then
              echo "::error::Native $repo executable not found in its attested archive"
              exit 1
            fi
            install -m 755 "$executable" "$RUNNER_TEMP/bin/$repo"
            # Native archives may ship a launcher plus a neighboring *-bin executable.
            sidecar="$(dirname "$executable")/$repo-bin"
            if [ -f "$sidecar" ]; then
              install -m 755 "$sidecar" "$RUNNER_TEMP/bin/$repo-bin"
              # The Ordo release's legacy launcher can target an unbuilt npm
              # dist/MANIFEST. Use its verified native sidecar for lifecycle.
              if [ "$repo" = "ordo" ]; then
                install -m 755 "$sidecar" "$RUNNER_TEMP/bin/ordo"
              fi
            fi
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conditor install and verification, isolated checkout only
        shell: bash
        run: |
          set -euo pipefail
          conditor init --target . --manifest ./conditor.json
          conditor verify --target . --manifest ./conditor.json
          conditor doctor --json --target . --manifest ./conditor.json
          praxis verify --strict
          ordo verify --integrity-only --json
      - name: Generate a reviewable diff (never auto-commit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap-preview"
          git status --short > "$RUNNER_TEMP/bootstrap-preview/status.txt"
          git diff --binary > "$RUNNER_TEMP/bootstrap-preview/tracked.patch"
          git ls-files --others --exclude-standard > "$RUNNER_TEMP/bootstrap-preview/new-files.txt"
          # Managed output may include generated content; do not publish this artifact
          # unless it has been reviewed for sensitive data. Status only is uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditor-preview-status
          path: ${{ runner.temp }}/bootstrap-preview/status.txt
          retention-days: 7
